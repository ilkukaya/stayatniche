backend:
  name: github
  repo: ilkukaya/stayatniche
  branch: claude/setup-stayatniche-project-xHSQk

media_folder: "public/images"
public_folder: "/images"

editor:
  preview: false

slug:
  encoding: "ascii"
  clean_accents: true

collections:

  # ═══════════════════════════════════════════════════════════
  # HOTELS
  # ═══════════════════════════════════════════════════════════
  - name: "hotels"
    label: "Hotels"
    label_singular: "Hotel"
    folder: "src/content/hotels"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{name}} — {{destination}}, {{country}}"
    sortable_fields: ["name", "rating", "publishedDate", "country", "category"]
    view_filters:
      - label: "Featured"
        field: "featured"
        pattern: true
      - label: "Editor's Pick"
        field: "editorsPick"
        pattern: true
      - label: "Drafts"
        field: "status"
        pattern: "draft"
    view_groups:
      - label: "Category"
        field: "category"
      - label: "Country"
        field: "country"
    fields:
      - { label: "Hotel Name", name: "name", widget: "string" }
      - label: "Category"
        name: "category"
        widget: "select"
        required: false
        options:
          - { label: "Treehouse Hotels", value: "treehouse-hotels" }
          - { label: "Cave Hotels", value: "cave-hotels" }
          - { label: "Underwater Rooms", value: "underwater-rooms" }
          - { label: "Castle Hotels", value: "castle-hotels" }
          - { label: "Floating Hotels", value: "floating-hotels" }
          - { label: "Bubble Hotels", value: "bubble-hotels" }
          - { label: "Cliffside Hotels", value: "cliffside-hotels" }
          - { label: "Desert Camps", value: "desert-camps" }
          - { label: "Jungle Lodges", value: "jungle-lodges" }
          - { label: "Ice Hotels", value: "ice-hotels" }
          - { label: "Safari Lodges", value: "safari-lodges" }
          - { label: "Lighthouse Hotels", value: "lighthouse-hotels" }
          - { label: "Train Hotels", value: "train-hotels" }
          - { label: "Overwater Bungalows", value: "overwater-bungalows" }
      - { label: "Destination / City", name: "destination", widget: "string", required: false }
      - { label: "Country", name: "country", widget: "string", required: false }
      - { label: "Continent", name: "continent", widget: "select", required: false, options: ["europe","asia","north-america","south-america","africa","oceania","middle-east"] }
      - { label: "Address", name: "address", widget: "string", required: false }
      - { label: "Short Description", name: "description", widget: "text", required: false, hint: "150–200 chars. Used in cards and meta." }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Gallery", name: "gallery", widget: "list", required: false, field: { label: "Image", name: "image", widget: "image" } }
      - { label: "Price Range", name: "priceRange", widget: "string", required: false, hint: "e.g. $300 – $600 per night" }
      - { label: "Starting Price (USD/night)", name: "pricePerNight", widget: "number", required: false }
      - { label: "Price Indicator (1–5)", name: "priceIndicator", widget: "number", required: false, min: 1, max: 5 }
      - { label: "Highlights", name: "highlights", widget: "list", required: false, field: { label: "Highlight", name: "highlight", widget: "string" } }
      - { label: "Amenities", name: "amenities", widget: "list", required: false, field: { label: "Amenity", name: "amenity", widget: "string" } }
      - { label: "Best For", name: "bestFor", widget: "list", required: false, field: { label: "Type", name: "type", widget: "string" } }
      - { label: "Tags", name: "tags", widget: "list", required: false, field: { label: "Tag", name: "tag", widget: "string" } }
      - label: "Pros & Cons"
        name: "prosAndCons"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Pros", name: "pros", widget: "list", required: false, field: { label: "Pro", name: "pro", widget: "string" } }
          - { label: "Cons", name: "cons", widget: "list", required: false, field: { label: "Con", name: "con", widget: "string" } }
      - { label: "Primary Booking URL", name: "bookingUrl", widget: "string", required: false }
      - label: "Additional Affiliate Links"
        name: "affiliateLinks"
        widget: "list"
        required: false
        collapsed: true
        fields:
          - { label: "Partner", name: "partner", widget: "select", required: false, options: ["booking","hotels","expedia","agoda","airbnb","official","other"] }
          - { label: "URL", name: "url", widget: "string", required: false }
          - { label: "Button Label", name: "label", widget: "string", required: false, default: "Check Rates" }
      - { label: "Editor Rating (1–10)", name: "rating", widget: "number", required: false, value_type: "float", min: 1, max: 10, step: 0.1 }
      - { label: "Review Count", name: "reviewCount", widget: "number", required: false }
      - label: "Check-in / Check-out"
        name: "checkInOut"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Check-in Time", name: "checkIn", widget: "string", required: false, default: "15:00" }
          - { label: "Check-out Time", name: "checkOut", widget: "string", required: false, default: "11:00" }
      - label: "Seasonal Info"
        name: "seasonalInfo"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Best Time to Visit", name: "bestTime", widget: "string", required: false }
          - { label: "Peak Season", name: "peakSeason", widget: "string", required: false }
          - { label: "Low Season Notes", name: "lowSeason", widget: "string", required: false }
          - { label: "Notes", name: "notes", widget: "text", required: false }
      - label: "Nearby Attractions"
        name: "nearbyAttractions"
        widget: "list"
        required: false
        collapsed: true
        fields:
          - { label: "Name", name: "name", widget: "string", required: false }
          - { label: "Distance", name: "distance", widget: "string", required: false }
      - label: "Coordinates"
        name: "coordinates"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Latitude", name: "lat", widget: "number", required: false, value_type: "float" }
          - { label: "Longitude", name: "lng", widget: "number", required: false, value_type: "float" }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Editor's Pick", name: "editorsPick", widget: "boolean", required: false, default: false }
      - { label: "Trending Now", name: "trending", widget: "boolean", required: false, default: false }
      - { label: "Status", name: "status", widget: "select", required: false, default: "published", options: ["published","draft","archived"] }
      - { label: "Published Date", name: "publishedDate", widget: "datetime", required: false }
      - { label: "Last Updated", name: "updatedDate", widget: "datetime", required: false }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - { label: "OG Image", name: "ogImage", widget: "image", required: false }
          - { label: "No Index", name: "noIndex", widget: "boolean", required: false, default: false }
      - { label: "Full Review", name: "body", widget: "markdown", required: false }

  # ═══════════════════════════════════════════════════════════
  # CATEGORIES
  # ═══════════════════════════════════════════════════════════
  - name: "categories"
    label: "Categories"
    label_singular: "Category"
    folder: "src/content/categories"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ["title", "order"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Tagline", name: "tagline", widget: "string", required: false }
      - { label: "Short Description", name: "description", widget: "text", required: false }
      - { label: "Icon (emoji, fallback only)", name: "icon", widget: "string", required: false, hint: "Used as fallback if no cover photo" }
      - { label: "Cover Photo", name: "coverImage", widget: "image", required: false, hint: "Main photo shown on category card and hero" }
      - { label: "Hero Image (optional larger)", name: "heroImage", widget: "image", required: false }
      - label: "Stats"
        name: "stats"
        widget: "object"
        required: false
        fields:
          - { label: "Hotel Count", name: "hotelCount", widget: "number", required: false, default: 0 }
          - { label: "Average Price ($/night)", name: "avgPrice", widget: "number", required: false, default: 0 }
          - { label: "Top Destination", name: "topDestination", widget: "string", required: false }
      - { label: "Featured on Homepage", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Sort Order", name: "order", widget: "number", required: false, default: 99 }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - { label: "OG Image", name: "ogImage", widget: "image", required: false }
      - { label: "Long Description", name: "body", widget: "markdown", required: false }

  # ═══════════════════════════════════════════════════════════
  # BLOG
  # ═══════════════════════════════════════════════════════════
  - name: "blog"
    label: "Blog"
    label_singular: "Article"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    sortable_fields: ["title", "publishedDate"]
    view_filters:
      - label: "Featured"
        field: "featured"
        pattern: true
      - label: "Drafts"
        field: "status"
        pattern: "draft"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string", required: false, default: "StayAtNiche Team" }
      - { label: "Article Type", name: "category", widget: "select", required: false, options: ["destination-guide","hotel-review","travel-tips","listicle","itinerary","budget-travel","luxury-travel","news","gear-packing"] }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Published Date", name: "publishedDate", widget: "datetime", required: false }
      - { label: "Last Updated", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Contains Affiliate Links", name: "affiliateDisclosure", widget: "boolean", required: false, default: true }
      - { label: "Sponsored Post", name: "sponsored", widget: "boolean", required: false, default: false }
      - { label: "Related Hotels", name: "relatedHotels", widget: "list", required: false, field: { label: "Hotel Slug", name: "slug", widget: "string" } }
      - { label: "Status", name: "status", widget: "select", required: false, default: "published", options: ["published","draft"] }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - { label: "OG Image", name: "ogImage", widget: "image", required: false }
      - { label: "Content", name: "body", widget: "markdown", required: false }

  # ═══════════════════════════════════════════════════════════
  # DESTINATIONS
  # ═══════════════════════════════════════════════════════════
  - name: "destinations"
    label: "Destinations"
    label_singular: "Destination"
    folder: "src/content/destinations"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{name}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Type", name: "type", widget: "select", required: false, options: ["country","city","region","island"] }
      - { label: "Continent", name: "continent", widget: "select", required: false, options: ["europe","asia","north-america","south-america","africa","oceania","middle-east"] }
      - { label: "Country (if city/region)", name: "country", widget: "string", required: false }
      - { label: "Short Description", name: "description", widget: "text", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "image", required: false }
      - label: "Travel Essentials"
        name: "essentials"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Currency", name: "currency", widget: "string", required: false }
          - { label: "Language(s)", name: "language", widget: "string", required: false }
          - { label: "Timezone", name: "timezone", widget: "string", required: false }
          - { label: "Visa Info", name: "visaInfo", widget: "text", required: false }
          - { label: "Power Plug", name: "plugType", widget: "string", required: false }
      - label: "Best Time to Visit"
        name: "bestTimeToVisit"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Summary", name: "summary", widget: "string", required: false }
          - { label: "Details", name: "details", widget: "text", required: false }
      - { label: "Must-See Attractions", name: "mustSee", widget: "list", required: false, field: { label: "Attraction", name: "attraction", widget: "string" } }
      - { label: "Travel Tips", name: "travelTips", widget: "list", required: false, field: { label: "Tip", name: "tip", widget: "string" } }
      - label: "Coordinates"
        name: "coordinates"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Latitude", name: "lat", widget: "number", required: false, value_type: "float" }
          - { label: "Longitude", name: "lng", widget: "number", required: false, value_type: "float" }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Sort Order", name: "order", widget: "number", required: false, default: 99 }
      - label: "SEO"
        name: "seo"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - { label: "Meta Title", name: "metaTitle", widget: "string", required: false }
          - { label: "Meta Description", name: "metaDescription", widget: "text", required: false }
          - { label: "OG Image", name: "ogImage", widget: "image", required: false }
      - { label: "Guide Content", name: "body", widget: "markdown", required: false }

  # ═══════════════════════════════════════════════════════════
  # EXPERIENCES
  # ═══════════════════════════════════════════════════════════
  - name: "experiences"
    label: "Experiences"
    label_singular: "Experience"
    folder: "src/content/experiences"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Type", name: "type", widget: "select", required: false, options: ["guided-tour","adventure","cultural","food-drink","wellness","water-activity","wildlife","day-trip","night-experience"] }
      - { label: "Destination", name: "destination", widget: "string", required: false }
      - { label: "Country", name: "country", widget: "string", required: false }
      - { label: "Short Description", name: "description", widget: "text", required: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - label: "Booking Details"
        name: "booking"
        widget: "object"
        required: false
        fields:
          - { label: "Provider", name: "provider", widget: "select", required: false, options: ["getyourguide","viator","klook","direct","other"] }
          - { label: "Booking URL", name: "url", widget: "string", required: false }
          - { label: "Starting Price", name: "price", widget: "string", required: false }
          - { label: "Duration", name: "duration", widget: "string", required: false }
      - { label: "Highlights", name: "highlights", widget: "list", required: false, field: { label: "Highlight", name: "highlight", widget: "string" } }
      - { label: "What's Included", name: "included", widget: "list", required: false, field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Not Included", name: "notIncluded", widget: "list", required: false, field: { label: "Item", name: "item", widget: "string" } }
      - { label: "Rating (1–10)", name: "rating", widget: "number", required: false, value_type: "float", min: 1, max: 10, step: 0.1 }
      - { label: "Review Count", name: "reviewCount", widget: "number", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", required: false, default: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Full Description", name: "body", widget: "markdown", required: false }

  # ═══════════════════════════════════════════════════════════
  # SETTINGS
  # ═══════════════════════════════════════════════════════════
  - name: "settings"
    label: "Settings"
    files:
      - label: "General"
        name: "general"
        file: "src/content/settings/general.json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string", required: false }
          - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - { label: "Site Description", name: "siteDescription", widget: "text", required: false }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Favicon", name: "favicon", widget: "image", required: false }
          - { label: "Language Code", name: "language", widget: "string", required: false, default: "en" }

      - label: "SEO & Meta"
        name: "seo"
        file: "src/content/settings/seo.json"
        fields:
          - { label: "Meta Title Template", name: "titleTemplate", widget: "string", required: false }
          - { label: "Default Meta Description", name: "defaultDescription", widget: "text", required: false }
          - { label: "Default OG Image", name: "defaultOgImage", widget: "image", required: false }
          - { label: "Twitter Handle", name: "twitterHandle", widget: "string", required: false }
          - { label: "Canonical Base URL", name: "canonicalUrl", widget: "string", required: false }
          - { label: "Google Site Verification", name: "googleVerification", widget: "string", required: false }
          - { label: "Bing Site Verification", name: "bingVerification", widget: "string", required: false }
          - label: "Structured Data"
            name: "structuredData"
            widget: "object"
            required: false
            fields:
              - { label: "Organization Name", name: "orgName", widget: "string", required: false }
              - { label: "Organization Logo", name: "orgLogo", widget: "image", required: false }

      - label: "Affiliate IDs"
        name: "affiliates"
        file: "src/content/settings/affiliates.json"
        fields:
          - label: "Booking.com"
            name: "booking"
            widget: "object"
            required: false
            fields:
              - { label: "Affiliate ID (aid)", name: "affiliateId", widget: "string", required: false }
              - { label: "Button Label", name: "label", widget: "string", required: false, default: "Check Rates on Booking.com" }
          - label: "Hotels.com"
            name: "hotelscom"
            widget: "object"
            required: false
            fields:
              - { label: "Affiliate ID", name: "affiliateId", widget: "string", required: false }
              - { label: "Button Label", name: "label", widget: "string", required: false }
          - label: "Expedia"
            name: "expedia"
            widget: "object"
            required: false
            fields:
              - { label: "Affiliate ID", name: "affiliateId", widget: "string", required: false }
          - label: "Agoda"
            name: "agoda"
            widget: "object"
            required: false
            fields:
              - { label: "Affiliate ID (cid)", name: "affiliateId", widget: "string", required: false }
          - label: "GetYourGuide"
            name: "getyourguide"
            widget: "object"
            required: false
            fields:
              - { label: "Partner ID", name: "partnerId", widget: "string", required: false }
          - label: "Viator"
            name: "viator"
            widget: "object"
            required: false
            fields:
              - { label: "Partner ID", name: "partnerId", widget: "string", required: false }
          - label: "Klook"
            name: "klook"
            widget: "object"
            required: false
            fields:
              - { label: "Partner ID", name: "partnerId", widget: "string", required: false }
          - label: "Amazon Associates"
            name: "amazon"
            widget: "object"
            required: false
            fields:
              - { label: "Associate Tag", name: "associateTag", widget: "string", required: false }
          - { label: "Default CTA Button Text", name: "defaultCtaText", widget: "string", required: false, default: "Check Best Rates" }
          - { label: "Affiliate Disclosure Text", name: "disclosureText", widget: "text", required: false }

      - label: "Analytics & Tracking"
        name: "analytics"
        file: "src/content/settings/analytics.json"
        fields:
          - { label: "Google Analytics 4 ID", name: "ga4Id", widget: "string", required: false, hint: "G-XXXXXXXXXX" }
          - { label: "Google Tag Manager ID", name: "gtmId", widget: "string", required: false, hint: "GTM-XXXXXX" }
          - { label: "Facebook Pixel ID", name: "fbPixelId", widget: "string", required: false }
          - { label: "Pinterest Tag ID", name: "pinterestTagId", widget: "string", required: false }
          - { label: "Hotjar Site ID", name: "hotjarId", widget: "string", required: false }
          - { label: "Microsoft Clarity ID", name: "clarityId", widget: "string", required: false }
          - { label: "Plausible Domain", name: "plausibleDomain", widget: "string", required: false }

      - label: "Social Media"
        name: "social"
        file: "src/content/settings/social.json"
        fields:
          - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
          - { label: "Pinterest URL", name: "pinterest", widget: "string", required: false }
          - { label: "Twitter / X URL", name: "twitter", widget: "string", required: false }
          - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
          - { label: "TikTok URL", name: "tiktok", widget: "string", required: false }
          - { label: "YouTube URL", name: "youtube", widget: "string", required: false }

      - label: "Navigation"
        name: "navigation"
        file: "src/content/settings/navigation.json"
        fields:
          - label: "Main Navigation"
            name: "mainNav"
            widget: "list"
            required: false
            fields:
              - { label: "Label", name: "label", widget: "string", required: false }
              - { label: "URL", name: "url", widget: "string", required: false }
              - { label: "Open in New Tab", name: "external", widget: "boolean", required: false, default: false }
          - label: "Footer Columns"
            name: "footerColumns"
            widget: "list"
            required: false
            fields:
              - { label: "Column Title", name: "title", widget: "string", required: false }
              - label: "Links"
                name: "links"
                widget: "list"
                required: false
                fields:
                  - { label: "Label", name: "label", widget: "string", required: false }
                  - { label: "URL", name: "url", widget: "string", required: false }
          - { label: "Footer Copyright", name: "copyright", widget: "string", required: false }

      - label: "Homepage"
        name: "homepage"
        file: "src/content/settings/homepage.json"
        fields:
          - label: "Hero Section"
            name: "hero"
            widget: "object"
            required: false
            fields:
              - { label: "Headline", name: "headline", widget: "string", required: false }
