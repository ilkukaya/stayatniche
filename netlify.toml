[build]
  command = "npm run build"
  publish = "dist"
  base = "."

[build.environment]
  NODE_VERSION = "20"

# ── Production branch (the repo's default branch) ─────────────────────────────
[context.production]
  branch = "claude/setup-stayatniche-project-xHSQk"
  command = "npm run build"

# ── Redirects ──────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301

# ── Security headers (all pages) ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-DNS-Prefetch-Control = "on"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms https://plausible.io https://identity.netlify.com https://c121.travelpayouts.com https://tp.media https://www.klook.com https://affiliate.klook.com https://tiqets.com https://www.tiqets.com https://kiwi.com https://www.kiwi.com https://www.aviasales.com https://localrent.com https://www.qeeq.com https://www.autoeurope.com https://www.economybookings.com https://www.getrentacar.com https://www.bikebooking.com https://intui.travel https://wegotrip.com https://www.ticketnetwork.com https://searadar.com https://radicalstorage.com https://www.airhelp.com https://compensair.com https://ekta.travel https://nordvpn.com https://yesim.app https://www.airalo.com https://saily.com https://drimsim.com https://www.welcomepickups.com https://kiwitaxi.com https://gettransfer.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://c121.travelpayouts.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://www.clarity.ms https://plausible.io https://api.netlify.com https://c121.travelpayouts.com https://tp.media https://api.tiqets.com https://api.klook.com https://www.aviasales.com https://api.localrent.com https://api.qeeq.com https://api.airalo.com https://api.ekta.travel https://api.airhelp.com https://api.compensair.com https://api.radicalstorage.com https://api.welcomepickups.com https://api.kiwitaxi.com https://api.gettransfer.com https://api.bikebooking.com https://api.searadar.com; frame-src 'self' https://identity.netlify.com https://c121.travelpayouts.com https://tp.media https://www.klook.com https://www.tiqets.com https://www.kiwi.com https://www.welcomepickups.com https://kiwitaxi.com https://gettransfer.com https://localrent.com https://www.qeeq.com https://www.autoeurope.com https://www.economybookings.com https://www.getrentacar.com https://www.bikebooking.com https://searadar.com https://wegotrip.com https://www.airalo.com https://yesim.app https://saily.com https://ekta.travel; object-src 'none'; base-uri 'self'; form-action 'self' https://app.netlify.com;"

# ── Admin panel: allow same-origin framing for Decap CMS ──────────────────────
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://identity.netlify.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://api.github.com; frame-src 'self' https://identity.netlify.com; object-src 'none';"

# ── Immutable cache for hashed Astro assets ────────────────────────────────────
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Images: 1-week cache ───────────────────────────────────────────────────────
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ── Sitemap & robots: short cache for freshness ───────────────────────────────
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── llms.txt: allow AI crawlers to cache ──────────────────────────────────────
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── Web App Manifest ──────────────────────────────────────────────────────────
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "application/manifest+json"
