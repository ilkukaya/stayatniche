[build]
  command = "npm run build"
  publish = "dist"
  base = "."
  # Skip deploys for commits that only touch pipeline data / docs (nightly bot commits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)data/pipeline' ':(exclude)docs'"

[build.environment]
  NODE_VERSION = "20"

# ── Production branch (the repo's default branch) ─────────────────────────────
[context.production]
  branch = "claude/setup-stayatniche-project-xHSQk"
  command = "npm run build"

