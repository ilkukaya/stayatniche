name: Fetch hotel photos (Wikimedia)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: node scripts/fetch-wikimedia-photos.mjs
      - run: node scripts/fetch-wikimedia-photos.mjs --destinations
      - name: Commit results to the same branch
        run: |
          git config user.name "stayatniche-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/images/hotels public/images/destinations src/data/photo-credits.json
          git diff --cached --quiet && echo "No new photos" && exit 0
          git commit -m "Add free-licensed photos from Wikimedia Commons"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
