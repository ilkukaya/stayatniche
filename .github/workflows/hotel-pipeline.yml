name: Hotel pipeline (nightly)

# Nightly, free, no AI: apply yesterday's Haiku decisions -> discover new candidates -> verify
# (country, site checks) -> fetch evidence packs for the next candidates in cell priority order.
# Evidence packs live on the orphan `pipeline-data` branch (one commit, overwritten nightly) so
# the default branch history stays small. The Claude classifier routine reads them from there.
on:
  schedule:
    - cron: '17 1 * * *'   # GitHub often starts scheduled runs a few hours late
  workflow_dispatch:
    inputs:
      categories:
        description: 'Categories to discover (space separated, empty = nightly rotation)'
        required: false
        default: ''
      verify_limit:
        description: 'Max candidates to verify'
        required: false
        default: '1000'
      evidence_count:
        description: 'Evidence packs to fetch (next candidates in priority order)'
        required: false
        default: '150'

permissions:
  contents: write

concurrency:
  group: hotel-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - name: Load evidence packs from pipeline-data
        run: |
          mkdir -p .pipeline-data/inbox
          if git fetch --depth 1 origin pipeline-data; then git archive FETCH_HEAD | tar -x -C .pipeline-data; fi
          # One-time move of packs that were committed to the default branch.
          if [ -d data/pipeline/inbox ]; then cp -n data/pipeline/inbox/*.json .pipeline-data/inbox/ || true; git rm -rq data/pipeline/inbox; fi
          echo "packs: $(ls .pipeline-data/inbox | wc -l)"
      - run: node pipeline/apply-decisions.mjs
      - run: node pipeline/discover.mjs ${{ github.event.inputs.categories }}
      - run: node pipeline/verify.mjs ${{ github.event.inputs.verify_limit || '1000' }}
      - run: node pipeline/evidence.mjs --next ${{ github.event.inputs.evidence_count || '150' }}
      - run: node pipeline/status.mjs
      - name: Commit queue
        run: |
          git config user.name "stayatniche-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pipeline
          if ! git diff --cached --quiet; then
            git commit -m "pipeline: nightly apply + discover + verify + evidence"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Publish evidence packs to pipeline-data
        run: |
          export GIT_INDEX_FILE="$RUNNER_TEMP/pipeline-data.index"
          git --work-tree=.pipeline-data add -A
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "pipeline data $(date -u +%F)")
          git push -f origin "$commit:refs/heads/pipeline-data"
