name: Evidence packs (sample)

# Fetches official websites for the candidates listed in data/pipeline/sample-ids.json and
# commits the evidence packs (data/pipeline/inbox/) back to the same branch, so a Claude session
# without web access can classify them.
on:
  push:
    branches: ['claude/**']
    paths: ['data/pipeline/sample-ids.json', 'pipeline/evidence.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node pipeline/evidence.mjs data/pipeline/sample-ids.json
      - name: Commit evidence packs
        run: |
          git config user.name "stayatniche-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/pipeline/inbox
          git diff --cached --quiet && exit 0
          git commit -m "pipeline: evidence packs for sample"
          git pull --rebase origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}
